version: 1
test:
  phases:
    preTest:
      commands:
        - npm ci
        - npm install -g pm2
        - npm install -g wait-on
        - npm install mocha mochawesome
        - npm install mochawesome-merge
        - npm install -g mochawesome-report-generator
        # - npm install -g ts-node

        # - npx tsc cypress/cognito-setup.ts --outDir cypress/dist

        # Run the Cognito user management script with ts-node
        - echo "Running Cognito User Setup Script..."
        # - ts-node cypress/cognito-setup.ts || { echo "Cognito setup failed!
        # Exiting..."; exit 1; }
        - node amplify/cognito-setup.mjs || { echo "Cognito setup failed!
          Exiting..."; exit 1; }

        # Start the frontend server
        - pm2 start npm -- run dev
        - wait-on http://localhost:5173
    test:
      commands:
        - 'npx cypress run --reporter mochawesome --reporter-options
          "reportDir=cypress/report/mochawesome-report,overwrite=false,html=false,json=true,timestamp=mmddyyyy_HHMMss"'
    postTest:
      commands:
        - npx mochawesome-merge
          cypress/report/mochawesome-report/mochawesome*.json >
          cypress/report/mochawesome.json
        - pm2 kill
  artifacts:
    baseDirectory: cypress
    configFilePath: "**/mochawesome.json"
    files:
      - "**/*.png"
      - "**/*.mp4"
backend:
  phases:
    preBuild:
      commands:
        - nvm use || nvm install
        - node -v
        - npm ci --verbose
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - "echo $AWS_BRANCH"
        - |
          case "${AWS_BRANCH}" in
              main)
                  echo "Deploying main branch..."
                  npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
                  ;;
              dev)
                  echo "Deploying dev branch..."
                  npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
                  ;;
              pr-*)
                  echo "Deploying pull request branch..."
                  npx ampx generate outputs --branch previews --app-id $AWS_APP_ID
                  ;;
              *)
                  echo "Deploying to staging branch..."
                  npx ampx generate outputs --branch dev --app-id $AWS_APP_ID
                  ;;
          esac
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
